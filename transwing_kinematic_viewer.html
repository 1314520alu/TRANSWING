<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transwing 电机查看器</title>
  <style>
    :root {
      --bg: #edf2f4;
      --panel: rgba(255, 255, 255, 0.95);
      --line: #ccd6dc;
      --ink: #172126;
      --muted: #5e6a71;
      --left: #d14b3f;
      --right: #1d7f96;
      --axis-x: #c6463f;
      --axis-y: #1f7f8e;
      --axis-z: #577b42;
      --thrust: #6e58c7;
      --path: #f0b44c;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      min-height: 100vh;
    }

    #scene-wrap {
      min-width: 0;
      min-height: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.46), transparent 28%),
        linear-gradient(180deg, #eef3f6 0%, #dde6eb 100%);
    }

    #scene {
      width: 100%;
      height: 100%;
      display: block;
    }

    aside {
      overflow: auto;
      border-left: 1px solid var(--line);
      background: var(--panel);
      padding: 20px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    .sub {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .control, .status-box, .motor-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .control, .status-box {
      margin-bottom: 12px;
    }

    label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    output {
      color: var(--ink);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--right);
    }

    button {
      width: 100%;
      min-height: 38px;
      border: 1px solid #afbac0;
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .button-row.single {
      grid-template-columns: 1fr;
    }

    .legend {
      display: grid;
      gap: 8px;
      margin: 14px 0 18px;
      font-size: 13px;
    }

    .item {
      display: grid;
      grid-template-columns: 16px 1fr;
      gap: 8px;
      align-items: center;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.18);
    }

    .section-title {
      margin: 18px 0 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .motor-grid {
      display: grid;
      gap: 10px;
    }

    .motor-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }

    .motor-name {
      font-size: 14px;
      font-weight: 700;
    }

    .motor-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 56px;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: #23323b;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .status-box, .mono {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 7px 4px;
      text-align: right;
    }

    th:first-child, td:first-child,
    th:nth-child(2), td:nth-child(2) {
      text-align: left;
    }

    .mono, .axis-table td:nth-child(2), .axis-table td:nth-child(3) {
      font-family: Consolas, "Microsoft YaHei Mono", monospace;
    }

    @media (max-width: 980px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) auto;
      }

      aside {
        border-left: 0;
        border-top: 1px solid var(--line);
        max-height: 48vh;
      }
    }
  </style>
</head>
<body>
  <main>
    <section id="scene-wrap">
      <canvas id="scene"></canvas>
    </section>
    <aside>
      <h1>Transwing 电机查看器</h1>
      <p class="sub">稳定版可视化。左侧不是 3D 模型，而是双视图示意：上半区看顶视图，下半区看侧视图。这样你能直接确认 4 个桨的顺序、旋向、推力方向和折叠角变化。</p>

      <section class="control">
        <label for="theta"><span>折叠角</span><output id="thetaOut">0 deg</output></label>
        <input id="theta" type="range" min="0" max="90" value="0" step="1" />
      </section>

      <div class="button-row">
        <button id="hoverPreset">Hover 预设</button>
        <button id="forwardPreset">Forward 预设</button>
      </div>
      <div class="button-row">
        <button id="spinUpPreset">全部升速</button>
        <button id="stopMotors">全部停桨</button>
      </div>
      <div class="button-row single">
        <button id="resetView">重置视图</button>
      </div>

      <div class="status-box" id="statusBox"></div>

      <div class="section-title">电机转速模拟</div>
      <section class="motor-grid" id="motorControls"></section>

      <div class="legend">
        <div class="item"><span class="swatch" style="background: var(--left)"></span><span>左侧电机</span></div>
        <div class="item"><span class="swatch" style="background: var(--right)"></span><span>右侧电机</span></div>
        <div class="item"><span class="swatch" style="background: var(--path)"></span><span>运动轨迹</span></div>
        <div class="item"><span class="swatch" style="background: var(--thrust)"></span><span>推力方向</span></div>
      </div>

      <div class="section-title">电机当前位置</div>
      <table>
        <thead>
          <tr>
            <th>电机</th>
            <th>位置</th>
            <th>X</th>
            <th>Y</th>
            <th>Z</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>

      <div class="section-title">折叠转轴数据</div>
      <table class="axis-table">
        <thead>
          <tr>
            <th>转轴</th>
            <th>H 点</th>
            <th>d 向量 / 端点</th>
          </tr>
        </thead>
        <tbody id="axisRows"></tbody>
      </table>

      <div class="mono" id="readout"></div>
    </aside>
  </main>

  <script>
    const BODY_FRAME = {
      origin: "CG",
      axes: { x: "forward", y: "right wing", z: "down" },
    };

    const AXES = [
      { name: "left_wing_hinge_axis", label: "Left hinge", point: [0, -0.126, 0.416], direction: [-0.457, 0.771, 0.486] },
      { name: "right_wing_hinge_axis", label: "Right hinge", point: [0, 0.126, 0.416], direction: [-0.457, -0.771, 0.486] },
    ];

    const MOTORS = [
      { id: "M1", testLetter: "A", position: "right_front", label: "M1 / A / RF", spin: "CCW", side: "right", unfolded: [0.525, 0.32, -0.045], folded: [0.155, 0.49, -0.46] },
      { id: "M2", testLetter: "C", position: "left_rear", label: "M2 / C / LR", spin: "CCW", side: "left", unfolded: [0.52, -0.98, -0.06], folded: [-0.48, -0.46, -0.355] },
      { id: "M3", testLetter: "D", position: "left_front", label: "M3 / D / LF", spin: "CW", side: "left", unfolded: [0.525, -0.32, -0.045], folded: [0.155, -0.49, -0.46] },
      { id: "M4", testLetter: "B", position: "right_rear", label: "M4 / B / RR", spin: "CW", side: "right", unfolded: [0.52, 0.98, -0.06], folded: [-0.48, 0.46, -0.355] },
    ];

    const canvas = document.querySelector("#scene");
    const wrap = document.querySelector("#scene-wrap");
    const ctx = canvas.getContext("2d");
    const thetaInput = document.querySelector("#theta");
    const thetaOut = document.querySelector("#thetaOut");
    const hoverPresetButton = document.querySelector("#hoverPreset");
    const forwardPresetButton = document.querySelector("#forwardPreset");
    const spinUpPresetButton = document.querySelector("#spinUpPreset");
    const stopMotorsButton = document.querySelector("#stopMotors");
    const resetViewButton = document.querySelector("#resetView");
    const motorControls = document.querySelector("#motorControls");
    const statusBox = document.querySelector("#statusBox");
    const rows = document.querySelector("#rows");
    const axisRows = document.querySelector("#axisRows");
    const readout = document.querySelector("#readout");

    const colors = {
      left: "#d14b3f",
      right: "#1d7f96",
      thrust: "#6e58c7",
      path: "#f0b44c",
      axis: "#202a30",
      axisX: "#c6463f",
      axisY: "#1f7f8e",
      axisZ: "#577b42",
      ink: "#172126",
      muted: "#6a7780",
      hull: "#9aa7af",
      grid: "#d7e0e6",
      topBg: "#eef4f7",
      sideBg: "#f7fafb",
    };

    const motorState = new Map(MOTORS.map((motor) => [motor.id, 0]));
    const motorOutputs = new Map();
    const rotorPhase = new Map(MOTORS.map((motor) => [motor.id, 0]));
    let currentTheta = 0;
    let lastFrameTime = performance.now();

    buildAxisRows();
    buildMotorControls();
    updateScene(0);
    animate();

    thetaInput.addEventListener("input", () => updateScene(Number(thetaInput.value)));
    hoverPresetButton.addEventListener("click", () => {
      thetaInput.value = "90";
      setAllMotorState(0.72);
      updateScene(90);
    });
    forwardPresetButton.addEventListener("click", () => {
      thetaInput.value = "0";
      setAllMotorState(0.44);
      updateScene(0);
    });
    spinUpPresetButton.addEventListener("click", () => {
      setAllMotorState(0.82);
      updateScene(Number(thetaInput.value));
    });
    stopMotorsButton.addEventListener("click", () => {
      setAllMotorState(0);
      updateScene(Number(thetaInput.value));
    });
    resetViewButton.addEventListener("click", () => {
      thetaInput.value = "0";
      setAllMotorState(0);
      updateScene(0);
    });

    function buildAxisRows() {
      axisRows.innerHTML = AXES.map((axis) => {
        const seg = axisSegment(axis, 0.5);
        return `<tr>
          <td>${axis.label}</td>
          <td>${format(axis.point)}</td>
          <td>d=${format(axis.direction)}<br>d-=${format(seg.start)}<br>d+=${format(seg.end)}</td>
        </tr>`;
      }).join("");
    }

    function buildMotorControls() {
      motorControls.innerHTML = MOTORS.map((motor) => `
        <section class="motor-card">
          <div class="motor-head">
            <div>
              <div class="motor-name">${motor.id} / ${motor.testLetter}</div>
              <div class="motor-meta">${motor.position} · ${motor.spin}</div>
            </div>
            <span class="badge" id="out-${motor.id}">0%</span>
          </div>
          <input id="motor-${motor.id}" type="range" min="0" max="100" value="0" step="1" />
        </section>
      `).join("");

      for (const motor of MOTORS) {
        const input = document.querySelector(`#motor-${motor.id}`);
        const output = document.querySelector(`#out-${motor.id}`);
        motorOutputs.set(motor.id, output);
        input.addEventListener("input", () => {
          setMotorState(motor.id, Number(input.value) / 100);
          updateScene(Number(thetaInput.value));
        });
      }
    }

    function updateScene(theta) {
      currentTheta = theta;
      thetaOut.textContent = `${theta.toFixed(0)} deg`;

      const current = motorRowsAt(theta);
      rows.innerHTML = current.map((motor) => `
        <tr>
          <td>${motor.id}/${motor.testLetter}</td>
          <td>${motor.position}</td>
          <td>${motor.current[0].toFixed(3)}</td>
          <td>${motor.current[1].toFixed(3)}</td>
          <td>${motor.current[2].toFixed(3)}</td>
        </tr>
      `).join("");

      const avg = current.reduce((sum, motor) => sum + (motorState.get(motor.id) || 0), 0) / current.length;
      statusBox.textContent = [
        `当前折叠角: ${theta.toFixed(0)} deg`,
        `平均电机指令: ${(avg * 100).toFixed(0)}%`,
        `状态判读: ${statusSummary(theta, avg)}`
      ].join("\n");

      readout.textContent = [
        `坐标系: 原点 ${BODY_FRAME.origin}; X=${BODY_FRAME.axes.x}; Y=${BODY_FRAME.axes.y}; Z=${BODY_FRAME.axes.z}`,
        `电机轴向: 0 deg 时推力朝 +X, 90 deg 时推力朝 -Z`,
        `电机状态: ${MOTORS.map((motor) => `${motor.id}=${Math.round((motorState.get(motor.id) || 0) * 100)}%`).join("  ")}`
      ].join("\n");
    }

    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
      lastFrameTime = now;

      for (const motor of MOTORS) {
        // Canvas has +Y downward, so positive visual rotation is clockwise.
        const direction = motor.spin === "CW" ? 1 : -1;
        const throttle = motorState.get(motor.id) || 0;
        rotorPhase.set(motor.id, rotorPhase.get(motor.id) + direction * dt * (1.5 + throttle * 12));
      }

      draw();
    }

    function draw() {
      resizeCanvas();
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const topRect = { x: 28, y: 28, w: w - 56, h: Math.max(220, (h - 84) * 0.52) };
      const sideRect = { x: 28, y: topRect.y + topRect.h + 28, w: w - 56, h: h - topRect.h - 84 };

      drawPanel(topRect, "顶视图");
      drawPanel(sideRect, "侧视图");

      drawTopView(topRect);
      drawSideView(sideRect);
    }

    function drawPanel(rect, title) {
      ctx.fillStyle = title === "顶视图" ? colors.topBg : colors.sideBg;
      ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
      ctx.strokeStyle = colors.grid;
      ctx.lineWidth = 1;
      ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
      ctx.fillStyle = colors.muted;
      ctx.font = "600 14px Microsoft YaHei";
      ctx.fillText(title, rect.x + 14, rect.y + 22);
    }

    function drawTopView(rect) {
      const motors = motorRowsAt(currentTheta);
      const origin = { x: rect.x + rect.w * 0.5, y: rect.y + rect.h * 0.55 };
      const scale = Math.min(rect.w * 0.26, rect.h * 0.22);

      drawGrid(origin, scale, rect, "xy");
      drawFuselageTop(origin, scale);
      drawMotorTrails(origin, scale, rect, "top");

      for (const motor of motors) {
        const p = motor.current;
        const sx = origin.x + p[0] * scale;
        const sy = origin.y + p[1] * scale;
        drawRotorDisc(motor, sx, sy, 26 + (motorState.get(motor.id) || 0) * 8, "top");
        drawLabel(`${motor.id}/${motor.testLetter}`, sx, sy - 34);
      }

      drawAxisLegendTop(origin, scale, rect);
    }

    function drawSideView(rect) {
      const motors = motorRowsAt(currentTheta);
      const origin = { x: rect.x + rect.w * 0.22, y: rect.y + rect.h * 0.7 };
      const scale = Math.min(rect.w * 0.42, rect.h * 0.5);

      drawGrid(origin, scale, rect, "xz");
      drawFuselageSide(origin, scale);

      for (const motor of motors) {
        const p = motor.current;
        const sx = origin.x + p[0] * scale;
        const sy = origin.y + p[2] * scale;
        drawRotorDisc(motor, sx, sy, 22 + (motorState.get(motor.id) || 0) * 8, "side");
        drawThrustArrow(motor, sx, sy, interpolateMotorDirection(motor, currentTheta), scale * 0.25);
      }

      drawAxisLegendSide(origin, scale, rect);
    }

    function drawGrid(origin, scale, rect, mode) {
      ctx.save();
      ctx.strokeStyle = "#d5dfe5";
      ctx.lineWidth = 1;
      for (let i = -4; i <= 4; i++) {
        if (mode === "xy") {
          const y = origin.y + i * scale * 0.25;
          ctx.beginPath();
          ctx.moveTo(rect.x + 12, y);
          ctx.lineTo(rect.x + rect.w - 12, y);
          ctx.stroke();
        } else {
          const y = origin.y + i * scale * 0.18;
          ctx.beginPath();
          ctx.moveTo(rect.x + 12, y);
          ctx.lineTo(rect.x + rect.w - 12, y);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    function drawFuselageTop(origin, scale) {
      ctx.save();
      ctx.fillStyle = "#a4b1b8";
      roundedRect(origin.x - scale * 0.5, origin.y - scale * 0.08, scale * 1.05, scale * 0.16, 12);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(origin.x + scale * 0.58, origin.y);
      ctx.lineTo(origin.x + scale * 0.42, origin.y - scale * 0.11);
      ctx.lineTo(origin.x + scale * 0.42, origin.y + scale * 0.11);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawFuselageSide(origin, scale) {
      ctx.save();
      ctx.fillStyle = "#a4b1b8";
      roundedRect(origin.x - scale * 0.38, origin.y - scale * 0.08, scale * 0.88, scale * 0.16, 10);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(origin.x + scale * 0.55, origin.y);
      ctx.lineTo(origin.x + scale * 0.38, origin.y - scale * 0.11);
      ctx.lineTo(origin.x + scale * 0.38, origin.y + scale * 0.11);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawMotorTrails(origin, scale) {
      ctx.save();
      ctx.strokeStyle = colors.path;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([5, 4]);
      for (const motor of MOTORS) {
        ctx.beginPath();
        for (let theta = 0; theta <= 90; theta += 3) {
          const p = interpolateMotorPosition(motor, theta);
          const sx = origin.x + p[0] * scale;
          const sy = origin.y + p[1] * scale;
          if (theta === 0) {
            ctx.moveTo(sx, sy);
          } else {
            ctx.lineTo(sx, sy);
          }
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawRotorDisc(motor, x, y, radius) {
      const sideColor = motor.side === "left" ? colors.left : colors.right;
      const throttle = motorState.get(motor.id) || 0;
      const phase = rotorPhase.get(motor.id) || 0;

      ctx.save();
      ctx.strokeStyle = sideColor;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.stroke();

      ctx.globalAlpha = 0.1 + throttle * 0.2;
      ctx.fillStyle = sideColor;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.translate(x, y);
      ctx.rotate(phase);
      drawBlade(radius * 0.95, 0);
      drawBlade(radius * 0.95, Math.PI / 2);
      ctx.restore();

      ctx.fillStyle = colors.ink;
      ctx.font = "11px Microsoft YaHei";
      ctx.fillText(motor.spin, x - 13, y + 4);
    }

    function drawBlade(length, angle) {
      ctx.save();
      ctx.rotate(angle);
      ctx.fillStyle = "#203038";
      roundedRect(-length * 0.5, -4, length, 8, 4);
      ctx.fill();
      ctx.restore();
    }

    function drawThrustArrow(motor, x, y, direction, length) {
      const throttle = motorState.get(motor.id) || 0;
      const dx = direction[0] * (length + throttle * 38);
      const dy = direction[2] * (length + throttle * 38);
      ctx.save();
      ctx.strokeStyle = colors.thrust;
      ctx.fillStyle = colors.thrust;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + dx, y + dy);
      ctx.stroke();
      const ang = Math.atan2(dy, dx);
      ctx.translate(x + dx, y + dy);
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-12, -6);
      ctx.lineTo(-12, 6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawAxisLegendTop(origin, scale, rect) {
      drawColorArrow(origin.x, rect.y + 30, origin.x + scale * 0.55, rect.y + 30, colors.axisX);
      drawColorArrow(origin.x, rect.y + 54, origin.x, rect.y + 54 + scale * 0.45, colors.axisY);
      drawLabel("X 前", origin.x + scale * 0.62, rect.y + 30);
      drawLabel("Y 右", origin.x + 20, rect.y + 54 + scale * 0.45);
    }

    function drawAxisLegendSide(origin, scale, rect) {
      drawColorArrow(rect.x + 26, origin.y, rect.x + 26 + scale * 0.45, origin.y, colors.axisX);
      drawColorArrow(rect.x + 26, origin.y, rect.x + 26, origin.y + scale * 0.35, colors.axisZ);
      drawLabel("X 前", rect.x + 26 + scale * 0.53, origin.y);
      drawLabel("Z 下", rect.x + 26, origin.y + scale * 0.43);
    }

    function drawColorArrow(x1, y1, x2, y2, color) {
      const ang = Math.atan2(y2 - y1, x2 - x1);
      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.translate(x2, y2);
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-11, -5);
      ctx.lineTo(-11, 5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawLabel(text, x, y) {
      ctx.save();
      ctx.fillStyle = colors.ink;
      ctx.font = "12px Microsoft YaHei";
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    function roundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function setMotorState(motorId, value) {
      const clamped = Math.max(0, Math.min(1, value));
      motorState.set(motorId, clamped);
      const input = document.querySelector(`#motor-${motorId}`);
      if (input) input.value = String(Math.round(clamped * 100));
      const output = motorOutputs.get(motorId);
      if (output) output.textContent = `${Math.round(clamped * 100)}%`;
    }

    function setAllMotorState(value) {
      for (const motor of MOTORS) setMotorState(motor.id, value);
    }

    function statusSummary(theta, averageMotor) {
      if (averageMotor < 0.05) return "停桨，适合只看折叠机构和电机位置。";
      if (theta >= 75) return "接近悬停构型，推力主要朝上。";
      if (theta <= 15) return "接近固定翼构型，推力主要朝前。";
      return "过渡构型，位置、力臂和推力方向都在同时变化。";
    }

    function motorRowsAt(thetaDeg) {
      return MOTORS.map((motor) => ({
        ...motor,
        current: interpolateMotorPosition(motor, thetaDeg),
      }));
    }

    function interpolateMotorPosition(motor, thetaDeg) {
      const s = smoothstep(thetaDeg / 90);
      return motor.unfolded.map((value, index) => round6(value * (1 - s) + motor.folded[index] * s));
    }

    function interpolateMotorDirection(_motor, thetaDeg) {
      const s = smoothstep(thetaDeg / 90);
      return unit([1 * (1 - s), 0, -1 * s]);
    }

    function axisSegment(axis, halfLength) {
      return {
        start: axis.point.map((value, index) => round6(value - axis.direction[index] * halfLength)),
        end: axis.point.map((value, index) => round6(value + axis.direction[index] * halfLength)),
      };
    }

    function smoothstep(value) {
      const x = Math.max(0, Math.min(1, value));
      return x * x * (3 - 2 * x);
    }

    function unit(vector) {
      const length = Math.hypot(vector[0], vector[1], vector[2]) || 1;
      return vector.map((value) => round6(value / length));
    }

    function round6(value) {
      return Math.round(value * 1e6) / 1e6;
    }

    function format(values) {
      return `(${values.map((value) => value.toFixed(3)).join(", ")})`;
    }

    function resizeCanvas() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.max(640, wrap.clientWidth);
      const height = Math.max(640, wrap.clientHeight);
      const actualWidth = Math.floor(width * ratio);
      const actualHeight = Math.floor(height * ratio);
      if (canvas.width !== actualWidth || canvas.height !== actualHeight) {
        canvas.width = actualWidth;
        canvas.height = actualHeight;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      }
    }
  </script>
</body>
</html>
